<html lang="en">
<head>

    <style>
        :root {
            --bg-primary: #05080a;
            --bg-secondary: #0d1117;
            --bg-tertiary: #161b22;
            --border-color: #30363d;
            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --accent-cyan: #58a6ff;
            --accent-green: #3fb950;
            --accent-orange: #d29922;
            --accent-red: #f85149;
            --accent-purple: #bc8cff;
            --accent-blue: #1f6feb;
            --glow-cyan: 0 0 10px rgba(88, 166, 255, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
            background-image: 
                linear-gradient(rgba(40, 50, 60, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(40, 50, 60, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-cyan); }

        .hud-header {
            position: sticky;
            top: 0;
            width: 100%;
            background: rgba(13, 17, 23, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 1.5rem 2rem;
            z-index: 1000;
            text-align: center;
        }

        .hud-logo {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--accent-green);
            text-transform: uppercase;
            letter-spacing: 2px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 0.5rem;
        }

        .hud-logo::before {
            content: '';
            display: block;
            width: 10px;
            height: 10px;
            background: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        .hud-title {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(90deg, #fff, var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .hud-subtitle {
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .filter-btn {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); }
        .filter-btn.active { background: var(--accent-cyan); color: #000; border-color: var(--accent-cyan); box-shadow: var(--glow-cyan); }

        .search-box {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            display: block;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.75rem 1rem;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box:focus { border-color: var(--accent-cyan); box-shadow: var(--glow-cyan); }
        .search-box::placeholder { color: var(--text-secondary); }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            border-radius: 8px;
            position: relative;
            transition: all 0.3s ease;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 4px; height: 100%;
            background: var(--border-color);
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: rgba(88, 166, 255, 0.5);
            background: var(--bg-tertiary);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .card:hover::before { width: 6px; }

        .card.cat-Aviation:hover::before { background: var(--accent-cyan); box-shadow: var(--glow-cyan); }
        .card.cat-Maritime:hover::before { background: var(--accent-blue); box-shadow: 0 0 10px rgba(31, 111, 235, 0.3); }
        .card.cat-Disaster:hover::before { background: var(--accent-red); box-shadow: 0 0 10px rgba(248, 81, 73, 0.3); }
        .card.cat-Infrastructure:hover::before { background: var(--accent-orange); box-shadow: 0 0 10px rgba(210, 153, 34, 0.3); }
        .card.cat-Urban:hover::before { background: var(--accent-green); box-shadow: 0 0 10px rgba(63, 185, 80, 0.3); }
        .card.cat-Media:hover::before { background: var(--accent-purple); box-shadow: 0 0 10px rgba(188, 140, 255, 0.3); }
        .card.cat-Developer:hover::before { background: #f0883e; box-shadow: 0 0 10px rgba(240, 136, 62, 0.3); }

        .card-id {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-category {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .card-desc {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 1rem;
        }

        .card-section {
            margin-top: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px dashed var(--border-color);
        }

        .section-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .step-list {
            padding-left: 1.2rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .step-list li { margin-bottom: 0.3rem; }

        .voice-cmd {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--accent-green);
            background: rgba(63, 185, 80, 0.05);
            padding: 0.5rem;
            border-radius: 4px;
            border: 1px solid rgba(63, 185, 80, 0.2);
        }

        @media (max-width: 768px) {
            .hud-title { font-size: 1.8rem; }
            .container { padding: 1rem; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

        ];

        const grid = document.getElementById('useCaseGrid');

        function renderCards(category = 'All', searchTerm = '') {
            grid.innerHTML = '';
            let count = 0;

            useCases.forEach((uc, index) => {
                const matchesCategory = category === 'All' || uc.c === category;
                const matchesSearch = uc.t.toLowerCase().includes(searchTerm) || uc.d.toLowerCase().includes(searchTerm) || uc.c.toLowerCase().includes(searchTerm);
                
                if (matchesCategory && matchesSearch) {
                    count++;
                    const card = document.createElement('div');
                    card.className = `card cat-${uc.c}`;
                    
                    const stepsHtml = uc.s.map(step => `<li>${step}</li>`).join('');
                    
                    card.innerHTML = `
                        <div class="card-id">
                            USE CASE // ${String(index + 1).padStart(3, '0')} 
                            <span class="card-category">${uc.c}</span>
                        </div>
                        <div class="card-title">${uc.t}</div>
                        <p class="card-desc">${uc.d}</p>
                        <div class="card-section">
                            <div class="section-label">Deployment Steps</div>
                            <ol class="step-list">${stepsHtml}</ol>
                        </div>
                        <div class="card-section">
                            <div class="section-label">Voice Sequence</div>
                            <div class="voice-cmd">${uc.v}</div>
                        </div>
                    `;
                    grid.appendChild(card);
                }
            });

            if (count === 0) {
                grid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: var(--text-secondary); padding: 4rem; font-family: 'JetBrains Mono', monospace;">NO RESULTS FOUND. ADJUST SEARCH PARAMETERS.</div>`;
            }
        }

        function filterCategory(cat) {
            const btns = document.querySelectorAll('.filter-btn');
            btns.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            const search = document.getElementById('searchInput').value.toLowerCase();
            renderCards(cat, search);
        }

        function searchCards() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const activeBtn = document.querySelector('.filter-btn.active');
            const cat = activeBtn ? activeBtn.innerText : 'All';
            renderCards(cat, searchTerm);
        }

        // Initial render
        renderCards();
    </script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MINEASK — Implementation Roadmap</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&family=Crimson+Pro:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #c9a227;
  --gold-light: #f0d060;
  --gold-dim: rgba(201,162,39,0.15);
  --copper: #b07030;
  --emerald: #1e4d3c;
  --dark: #0b1622;
  --dark2: #111d2c;
  --dark3: #192840;
  --text: #e8e4d8;
  --text-dim: #8a9ab0;
  --text-muted: #4a5a70;
  --border: rgba(201,162,39,0.18);
  --border-dim: rgba(201,162,39,0.08);
  --green: #3a9a5a;
  --green-bg: rgba(58,154,90,0.12);
  --red: #c05050;
  --cyan: #7ec8e3;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Crimson Pro', serif;
  background: var(--dark);
  color: var(--text);
  line-height: 1.6;
  font-size: 16px;
}
/* Header */
.header {
  background: linear-gradient(180deg, #060e18 0%, var(--dark) 100%);
  border-bottom: 1px solid var(--border);
  padding: 2.5rem 2rem 2rem;
  position: relative;
  overflow: hidden;
}
.header::before {
  content: '';
  position: absolute; inset: 0;
  background: repeating-linear-gradient(90deg, transparent, transparent 60px, rgba(201,162,39,0.025) 60px, rgba(201,162,39,0.025) 61px);
}
.header-inner { position: relative; max-width: 1100px; margin: 0 auto; }
.header-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.7rem;
  letter-spacing: 0.25em;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 0.8rem;
  opacity: 0.7;
}
.header h1 {
  font-family: 'Libre Baskerville', serif;
  font-size: 3rem;
  font-weight: 700;
  color: var(--gold);
  letter-spacing: 0.08em;
  line-height: 1;
  margin-bottom: 0.3rem;
}
.header-sub {
  font-size: 1.1rem;
  color: var(--text-dim);
  font-weight: 300;
  margin-bottom: 1.5rem;
}
.header-actions {
  display: flex; flex-wrap: wrap; gap: 0.6rem;
}
.btn {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.7rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 0.5rem 1rem;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--dark2);
  color: var(--text-dim);
  transition: all 0.2s;
}
.btn:hover { background: var(--gold-dim); border-color: var(--gold); color: var(--gold); }
.btn-primary {
  background: var(--gold);
  border-color: var(--gold);
  color: var(--dark);
  font-weight: 600;
}
.btn-primary:hover { background: var(--gold-light); border-color: var(--gold-light); color: var(--dark); }
.btn-danger { border-color: var(--red); color: var(--red); }
.btn-danger:hover { background: rgba(192,80,80,0.15); }

/* Body */
.body-wrap { max-width: 1100px; margin: 0 auto; padding: 0 2rem 4rem; }

/* Overall Progress */
.overall-progress {
  padding: 2rem 0;
  border-bottom: 1px solid var(--border-dim);
  margin-bottom: 2rem;
}
.progress-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 1rem;
}
.progress-title {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.75rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-muted);
}
.progress-pct {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 1.2rem;
  font-weight: 600;
  color: var(--gold);
}
.progress-bar {
  height: 4px;
  background: var(--dark3);
  border-radius: 2px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--gold), var(--copper));
  border-radius: 2px;
  transition: width 0.4s ease;
}

/* Phase list (TOC style) */
.phase-toc {
  display: flex; flex-wrap: wrap; gap: 0.4rem;
  margin-bottom: 2rem;
  padding-bottom: 2rem;
  border-bottom: 1px solid var(--border-dim);
}
.phase-toc-item {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.68rem;
  letter-spacing: 0.04em;
  padding: 0.3rem 0.7rem;
  border: 1px solid var(--border-dim);
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none;
}
.phase-toc-item:hover { border-color: var(--border); color: var(--text-dim); }
.phase-toc-item.active { border-color: var(--gold); color: var(--gold); background: var(--gold-dim); }
.phase-toc-item .toc-check {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  margin-right: 0.3rem;
  background: var(--dark3);
  vertical-align: middle;
}
.phase-toc-item .toc-check.done { background: var(--green); }

/* Phase section */
.phase {
  margin-bottom: 2.5rem;
  border: 1px solid var(--border-dim);
  background: var(--dark2);
  overflow: hidden;
}
.phase-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 1.25rem 1.5rem;
  cursor: pointer;
  user-select: none;
  border-bottom: 1px solid var(--border-dim);
  transition: background 0.2s;
}
.phase-header:hover { background: rgba(201,162,39,0.04); }
.phase-header-left { display: flex; align-items: center; gap: 1rem; }
.phase-badge {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  padding: 0.15rem 0.5rem;
  border: 1px solid;
  display: inline-block;
  white-space: nowrap;
}
.phase-badge.p0 { color: var(--text-muted); border-color: var(--text-muted); }
.phase-badge.p1 { color: var(--gold); border-color: var(--gold); }
.phase-badge.p2 { color: var(--cyan); border-color: var(--cyan); }
.phase-badge.p3 { color: #8ee0a0; border-color: #8ee0a0; }
.phase-badge.p4 { color: #d070b0; border-color: #d070b0; }
.phase-badge.p5 { color: #e09040; border-color: #e09040; }
.phase-badge.p6 { color: #e07070; border-color: #e07070; }
.phase-title {
  font-family: 'Libre Baskerville', serif;
  font-size: 1.15rem;
  color: var(--text);
}
.phase-meta {
  display: flex; align-items: center; gap: 1.5rem;
}
.phase-time {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.7rem;
  color: var(--text-muted);
}
.phase-progress-text {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.75rem;
  color: var(--gold);
  min-width: 3rem;
  text-align: right;
}
.phase-toggle {
  font-size: 1.2rem;
  color: var(--text-muted);
  transition: transform 0.2s;
  margin-left: 0.5rem;
}
.phase-toggle.open { transform: rotate(180deg); }
.phase-body {
  padding: 0;
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease, padding 0.3s ease;
}
.phase-body.open {
  max-height: none;
  padding: 1rem 1.5rem 1.5rem;
}

/* Phase progress bar inside phase */
.phase-progress-bar {
  height: 2px;
  background: var(--dark3);
  border-radius: 1px;
  margin-bottom: 1rem;
  overflow: hidden;
}
.phase-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--gold), var(--copper));
  border-radius: 1px;
  transition: width 0.4s ease;
}

/* Task list */
.task-list { list-style: none; }
.task-item {
  display: flex; align-items: flex-start; gap: 0.75rem;
  padding: 0.6rem 0;
  border-bottom: 1px solid var(--border-dim);
  transition: opacity 0.2s;
}
.task-item:last-child { border-bottom: none; }
.task-check {
  appearance: none;
  -webkit-appearance: none;
  width: 18px; height: 18px;
  min-width: 18px;
  border: 2px solid var(--text-muted);
  border-radius: 3px;
  cursor: pointer;
  position: relative;
  top: 2px;
  transition: all 0.2s;
  background: transparent;
}
.task-check:checked {
  background: var(--green);
  border-color: var(--green);
}
.task-check:checked::after {
  content: '✓';
  position: absolute;
  top: -2px; left: 2px;
  font-size: 13px;
  color: #fff;
  font-weight: bold;
}
.task-check:hover { border-color: var(--gold); }
.task-label {
  flex: 1;
  font-size: 0.95rem;
  color: var(--text-dim);
  cursor: pointer;
  line-height: 1.5;
}
.task-item.done .task-label {
  color: var(--text-muted);
  text-decoration: line-through;
  text-decoration-color: rgba(58,154,90,0.4);
}
.task-item.sub {
  padding-left: 2rem;
}
.task-item.sub .task-label { font-size: 0.88rem; }
.task-tag {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.06em;
  padding: 0.1rem 0.45rem;
  border: 1px solid var(--border-dim);
  color: var(--text-muted);
  white-space: nowrap;
  margin-left: 0.5rem;
}
.task-tag.data { border-color: rgba(126,200,227,0.3); color: var(--cyan); }
.task-tag.infra { border-color: rgba(201,162,39,0.3); color: var(--gold); }
.task-tag.backend { border-color: rgba(142,224,160,0.3); color: #8ee0a0; }
.task-tag.frontend { border-color: rgba(208,112,176,0.3); color: #d070b0; }
.task-tag.ai { border-color: rgba(224,144,64,0.3); color: #e09040; }
.task-tag.mvp { border-color: rgba(224,112,112,0.3); color: #e07070; }

/* Empty state */
.empty-state {
  text-align: center;
  padding: 3rem;
  color: var(--text-muted);
  font-style: italic;
}

/* Footer */
.footer {
  background: #060e18;
  border-top: 1px solid var(--border-dim);
  padding: 2rem;
  text-align: center;
}
.footer-logo {
  font-family: 'Libre Baskerville', serif;
  font-size: 1.4rem;
  color: var(--gold);
  letter-spacing: 0.15em;
  margin-bottom: 0.3rem;
}
.footer p {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.65rem;
  color: var(--text-muted);
  letter-spacing: 0.08em;
}

/* Toast notification */
.toast {
  position: fixed;
  bottom: 2rem;
  right: 2rem;
  background: var(--dark2);
  border: 1px solid var(--border);
  padding: 0.8rem 1.2rem;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.75rem;
  color: var(--text-dim);
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.3s;
  z-index: 100;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateY(0); }

/* Reset button inline */
.reset-inline {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.65rem;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  cursor: pointer;
  border: none;
  background: none;
  padding: 0.2rem 0.4rem;
  margin-left: 0.5rem;
  transition: color 0.2s;
}
.reset-inline:hover { color: var(--red); }

/* Hidden file input */
#fileInput { display: none; }

/* Responsive */
@media (max-width: 768px) {
  .header { padding: 1.5rem 1rem; }
  .header h1 { font-size: 2rem; }
  .body-wrap { padding: 0 1rem 3rem; }
  .phase-header { flex-wrap: wrap; gap: 0.5rem; }
  .phase-meta { flex-wrap: wrap; gap: 0.5rem; }
  .phase-toc { justify-content: center; }
  .header-actions { justify-content: center; }
  .task-item.sub { padding-left: 1rem; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="header-label">Implementation Roadmap · v1.0</div>
    <h1>MINEASK</h1>
    <p class="header-sub">AI-Powered Mining & Energy Intelligence Platform</p>
    <div class="header-actions">
      <button class="btn btn-primary" onclick="exportTxt()">Export .txt</button>
      <button class="btn" onclick="document.getElementById('fileInput').click()">Import .txt</button>
      <button class="btn btn-danger" onclick="resetAll()">Reset All</button>
    </div>
    <input type="file" id="fileInput" accept=".txt" onchange="importTxt(event)">
  </div>
</div>

<div class="body-wrap">

  <!-- Overall Progress -->
  <div class="overall-progress">
    <div class="progress-header">
      <span class="progress-title">Overall Progress</span>
      <span class="progress-pct" id="overallPct">0%</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="overallFill" style="width:0%"></div>
    </div>
  </div>

  <!-- Phase TOC -->
  <div class="phase-toc" id="phaseToc"></div>

  <!-- Phases container -->
  <div id="phasesContainer"></div>

</div>

<div class="footer">
  <div class="footer-logo">MINEASK</div>
  <p>Implementation Roadmap · Smart Innovations Ghana Ltd</p>
  <p style="margin-top:0.3rem; opacity:0.5">Generated May 2026 · v1.0</p>
</div>

<div class="toast" id="toast"></div>

<script>
const DATA_KEY = 'mineask-roadmap';


const PHASES = [
{
id:0,badge:'P1',badgeClass:'p1',title:'Foundation & Security (Completed)',time:'Completed',
tasks:[
{id:'p101',label:'JWT secret moved to MINEASK_JWT_SECRET environment variable',tag:'backend'},
{id:'p102',label:'AuthMiddleware integrated across Auth, Orchestrator and Scheduler services',tag:'backend'},
{id:'p103',label:'CORS configured with credential support',tag:'backend'},
{id:'p104',label:'Login rate limiting implemented (5 attempts / 60 seconds)',tag:'backend'},
{id:'p105',label:'Public metrics endpoint exempted from authentication',tag:'backend'},
{id:'p106',label:'Admin role-based access control implemented',tag:'backend'},
{id:'p107',label:'23 Admin API endpoints delivered',tag:'backend'}
]},
{
id:1,badge:'P2',badgeClass:'p2',title:'Frontend Integration',time:'Completed',
tasks:[
{id:'p201',label:'Admin dashboard API layer implemented',tag:'frontend'},
{id:'p202',label:'Mock fallback support added',tag:'frontend'},
{id:'p203',label:'Bulk loaders for Agents, Feature Flags, Map Types and Billing Plans',tag:'frontend'},
{id:'p204',label:'Dashboard, Users, Tokens, Billing, Agents and System pages connected',tag:'frontend'},
{id:'p205',label:'Protected admin routes and auth provider integration',tag:'frontend'},
{id:'p206',label:'All six agents displayed on home page',tag:'frontend'}
]},
{
id:2,badge:'P3',badgeClass:'p3',title:'Data & Operations Layer',time:'In Progress',
tasks:[
{id:'p301',label:'Connect Admin UI to production database',tag:'data'},
{id:'p302',label:'Replace in-memory storage',tag:'data'},
{id:'p303',label:'Implement persistent audit logging',tag:'data'},
{id:'p304',label:'Add database migrations',tag:'data'},
{id:'p305',label:'Replace dashboard mock statistics with live metrics',tag:'data'},
{id:'p306',label:'Implement token consumption and agent utilization analytics',tag:'data'},
{id:'p307',label:'Integrate mining and energy industry data feeds',tag:'data'},
{id:'p308',label:'Implement scheduler job execution and workflow monitoring',tag:'backend'}
]},
{
id:3,badge:'P4',badgeClass:'p4',title:'AI Intelligence Layer',time:'Critical Priority',
tasks:[
{id:'p401',label:'Connect orchestrator to OpenAI models',tag:'ai'},
{id:'p402',label:'Implement multi-agent execution flow',tag:'ai'},
{id:'p403',label:'Agent response aggregation and context sharing',tag:'ai'},
{id:'p404',label:'Conversation memory and context retention',tag:'ai'},
{id:'p405',label:'GeoSon geological intelligence generation',tag:'ai'},
{id:'p406',label:'ResourceIQ opportunity analysis',tag:'ai'},
{id:'p407',label:'MarketLens commodity forecasting',tag:'ai'},
{id:'p408',label:'EnergyScout energy intelligence',tag:'ai'},
{id:'p409',label:'RiskWatch risk assessment engine',tag:'ai'},
{id:'p410',label:'PermitAI regulatory intelligence',tag:'ai'}
]},
{
id:4,badge:'P5',badgeClass:'p5',title:'Production Readiness',time:'Planned',
tasks:[
{id:'p501',label:'Deploy Redis for rate limiting and caching',tag:'infra'},
{id:'p502',label:'SSL and secret management',tag:'infra'},
{id:'p503',label:'Monitoring, health checks and alerting',tag:'infra'},
{id:'p504',label:'CI/CD pipeline and automated deployment',tag:'infra'}
]},
{
id:5,badge:'P6',badgeClass:'p6',title:'Quality Assurance',time:'Planned',
tasks:[
{id:'p601',label:'Backend integration testing',tag:'mvp'},
{id:'p602',label:'Frontend dashboard testing',tag:'mvp'},
{id:'p603',label:'Authentication and route protection tests',tag:'mvp'},
{id:'p604',label:'End-to-end agent query workflow testing',tag:'mvp'},
{id:'p605',label:'Billing and subscription workflow testing',tag:'mvp'}
]},
{
id:6,badge:'NEXT',badgeClass:'p6',title:'Immediate Next Sprint',time:'Highest Priority',
tasks:[
{id:'p701',label:'Connect Admin UI → Database',tag:'mvp'},
{id:'p702',label:'Replace mock metrics with live metrics',tag:'mvp'},
{id:'p703',label:'Implement scheduler job execution',tag:'mvp'},
{id:'p704',label:'Connect OpenAI → Orchestrator → Agent Pipeline',tag:'ai'},
{id:'p705',label:'Add conversation memory',tag:'ai'},
{id:'p706',label:'Deploy Redis',tag:'infra'},
{id:'p707',label:'Build integration tests',tag:'mvp'},
{id:'p708',label:'Achieve AI-generated multi-agent mining & energy intelligence reports',tag:'ai'}
]}
];


let state = {};

function init() {
  const saved = localStorage.getItem(DATA_KEY);
  if (saved) {
    try { state = JSON.parse(saved); } catch(e) { resetState(); }
  } else {
    resetState();
  }
  render();
}

function resetState() {
  state = {};
  PHASES.forEach(p => {
    p.tasks.forEach(t => { state[t.id] = false; });
  });
  saveState();
}

function saveState() {
  localStorage.setItem(DATA_KEY, JSON.stringify(state));
}

function getPhaseStats(phase) {
  let done = 0, total = phase.tasks.length;
  phase.tasks.forEach(t => { if (state[t.id]) done++; });
  return { done, total, pct: total ? Math.round(done/total*100) : 0 };
}

function getOverallStats() {
  let done = 0, total = 0;
  PHASES.forEach(p => {
    p.tasks.forEach(t => {
      total++;
      if (state[t.id]) done++;
    });
  });
  return { done, total, pct: total ? Math.round(done/total*100) : 0 };
}

function togglePhase(id) {
  const body = document.getElementById('phaseBody-' + id);
  const toggle = document.getElementById('phaseToggle-' + id);
  const isOpen = body.classList.contains('open');
  if (isOpen) {
    body.classList.remove('open');
    toggle.classList.remove('open');
  } else {
    body.classList.add('open');
    toggle.classList.add('open');
  }
}

function toggleTask(id) {
  state[id] = !state[id];
  saveState();
  render();

  // toast
  const task = findTask(id);
  if (task) {
    showToast(state[id] ? '✓ ' + task.label : '✕ ' + task.label);
  }
}

function findTask(id) {
  for (const p of PHASES) {
    for (const t of p.tasks) {
      if (t.id === id) return t;
    }
  }
  return null;
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove('show'), 2000);
}

function exportTxt() {
  const lines = [];
  lines.push('MINEASK — Implementation Roadmap');
  lines.push('Exported: ' + new Date().toISOString().slice(0,10));
  lines.push('');

  PHASES.forEach(p => {
    const stats = getPhaseStats(p);
    lines.push('[' + p.badge + '] ' + p.title + ' (' + p.time + ') — ' + stats.done + '/' + stats.total + ' (' + stats.pct + '%)');
    lines.push('');
    p.tasks.forEach(t => {
      lines.push('  ' + (state[t.id] ? '[x]' : '[ ]') + ' ' + t.label);
    });
    lines.push('');
  });

  const overall = getOverallStats();
  lines.push('Overall: ' + overall.done + '/' + overall.total + ' (' + overall.pct + '%)');
  lines.push('');
  lines.push('MINEASK — Smart Innovations Ghana Ltd');
  lines.push('https://mineask.ai');

  const blob = new Blob([lines.join('\r\n')], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'mineask-roadmap-' + new Date().toISOString().slice(0,10) + '.txt';
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('Roadmap exported to .txt');
}

function importTxt(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const text = e.target.result;
    const lines = text.split(/\r?\n/);
    const newState = {};
    PHASES.forEach(p => { p.tasks.forEach(t => { newState[t.id] = false; }); });

    let found = 0;
    lines.forEach(line => {
      const trimmed = line.trim();
      const match = trimmed.match(/^\[(x| )\]\s+(.+)/);
      if (match) {
        const checked = match[1] === 'x';
        const label = match[2].trim();
        for (const p of PHASES) {
          for (const t of p.tasks) {
            if (t.label === label) {
              newState[t.id] = checked;
              found++;
              break;
            }
          }
        }
      }
    });

    if (found > 0) {
      state = newState;
      saveState();
      render();
      showToast('Imported ' + found + ' tasks from .txt');
    } else {
      showToast('No matching tasks found in file');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function resetAll() {
  if (!confirm('Reset all task progress? This cannot be undone.')) return;
  resetState();
  render();
  showToast('All progress reset');
}

function render() {
  const overall = getOverallStats();
  document.getElementById('overallPct').textContent = overall.done + '/' + overall.total + ' (' + overall.pct + '%)';
  document.getElementById('overallFill').style.width = overall.pct + '%';

  // TOC
  const tocEl = document.getElementById('phaseToc');
  tocEl.innerHTML = PHASES.map(p => {
    const stats = getPhaseStats(p);
    const allDone = stats.done === stats.total && stats.total > 0;
    return '<a class="phase-toc-item' + (allDone ? ' active' : '') + '" href="#phase-' + p.id + '">' +
      '<span class="toc-check' + (allDone ? ' done' : '') + '"></span>' +
      p.badge + ' · ' + p.title +
      '</a>';
  }).join('');

  // Phases
  const container = document.getElementById('phasesContainer');
  container.innerHTML = PHASES.map(p => {
    const stats = getPhaseStats(p);
    const isOpen = stats.done < stats.total;
    return '<div class="phase" id="phase-' + p.id + '">' +
      '<div class="phase-header" onclick="togglePhase(' + p.id + ')">' +
        '<div class="phase-header-left">' +
          '<span class="phase-badge ' + p.badgeClass + '">' + p.badge + '</span>' +
          '<span class="phase-title">' + p.title + '</span>' +
        '</div>' +
        '<div class="phase-meta">' +
          '<span class="phase-time">' + p.time + '</span>' +
          '<span class="phase-progress-text">' + stats.done + '/' + stats.total + '</span>' +
          '<span class="phase-toggle' + (isOpen ? ' open' : '') + '" id="phaseToggle-' + p.id + '">▾</span>' +
        '</div>' +
      '</div>' +
      '<div class="phase-progress-bar"><div class="phase-progress-fill" style="width:' + stats.pct + '%"></div></div>' +
      '<div class="phase-body' + (isOpen ? ' open' : '') + '" id="phaseBody-' + p.id + '">' +
        '<ul class="task-list">' +
        p.tasks.map(t => {
          const done = state[t.id];
          const tagHtml = t.tag ? '<span class="task-tag ' + t.tag + '">' + t.tag + '</span>' : '';
          return '<li class="task-item' + (done ? ' done' : '') + '">' +
            '<input type="checkbox" class="task-check" id="c-' + t.id + '"' + (done ? ' checked' : '') + ' onchange="toggleTask(\'' + t.id + '\')">' +
            '<label class="task-label" for="c-' + t.id + '">' + t.label + tagHtml + '</label>' +
          '</li>';
        }).join('') +
        '</ul>' +
        '<button class="reset-inline" onclick="resetPhase(' + p.id + ')">↺ Reset phase</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

function resetPhase(phaseId) {
  if (!confirm('Reset all tasks in this phase?')) return;
  const phase = PHASES.find(p => p.id === phaseId);
  if (!phase) return;
  phase.tasks.forEach(t => { state[t.id] = false; });
  saveState();
  render();
  showToast('Phase ' + phase.badge + ' reset');
}

init();
</script>
</body>
</html>

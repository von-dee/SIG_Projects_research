<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MineSentinel — Sample Generated Reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: oklch(0.98 0.003 250);
    --bg-rail: oklch(0.975 0.004 250);
    --bg-elevated: oklch(0.965 0.005 250);
    --bg-card: oklch(1 0 0);
    --bg-tint-malachite: oklch(0.94 0.03 155);
    --bg-tint-ochre: oklch(0.95 0.035 85);
    --bg-tint-copper: oklch(0.95 0.033 45);
    --bg-tint-red: oklch(0.96 0.03 25);
    --border: oklch(0.89 0.006 250);
    --border-soft: oklch(0.93 0.005 250);
    --malachite: oklch(0.46 0.12 155);
    --malachite-dim: oklch(0.70 0.07 155);
    --ochre: oklch(0.55 0.13 85);
    --ochre-dim: oklch(0.75 0.08 85);
    --copper: oklch(0.56 0.14 45);
    --copper-dim: oklch(0.75 0.08 45);
    --red: oklch(0.53 0.17 25);
    --red-dim: oklch(0.75 0.09 25);
    --ink: oklch(0.20 0.01 250);
    --ink-dim: oklch(0.40 0.01 250);
    --ink-faint: oklch(0.58 0.01 250);
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-serif: 'Source Serif 4', serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  html{ scroll-behavior:smooth; }
  html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--ink); font-family:var(--font-body); line-height:1.6; -webkit-font-smoothing:antialiased; }
  .topo{ position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0.035; }
  .shell{ position:relative; z-index:1; display:flex; min-height:100vh; }

  .masthead{
    position:sticky; top:0; z-index:20;
    background:oklch(0.995 0.001 250);
    border-bottom:1px solid var(--border-soft); padding:18px 30px 16px;
  }
  .masthead-row{ display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{ width:11px; height:11px; border-radius:2px; background:var(--malachite); box-shadow:0 0 0 3px var(--bg-tint-malachite); flex-shrink:0; }
  .brand-name{ font-family:var(--font-display); font-weight:700; font-size:15px; letter-spacing:0.02em; color:var(--ink); }
  .brand-sub{ font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); letter-spacing:0.03em; }
  h1.title{ font-family:var(--font-display); font-weight:600; font-size:22px; margin:10px 0 4px; color:var(--ink); letter-spacing:-0.01em; }
  .path-chip{ font-family:var(--font-mono); font-size:11.5px; color:var(--malachite); background:var(--bg-tint-malachite); border:1px solid var(--malachite-dim); padding:3px 9px; border-radius:5px; white-space:nowrap; }
  .source-note{ font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); margin-top:6px; }

  .rail{ width:272px; flex-shrink:0; background:var(--bg-rail); border-right:1px solid var(--border-soft); padding:18px 12px 30px; position:sticky; top:0; align-self:flex-start; height:100vh; overflow-y:auto; }
  .rail-label{ font-family:var(--font-mono); font-size:10px; letter-spacing:0.12em; color:var(--ink-faint); text-transform:uppercase; padding:4px 10px 10px; }
  .tab-btn{ display:flex; align-items:center; gap:10px; width:100%; background:transparent; border:1px solid transparent; border-left:3px solid transparent; border-radius:6px; padding:9px 10px; margin-bottom:2px; cursor:pointer; text-align:left; color:var(--ink-dim); transition:background .15s ease, border-color .15s ease, color .15s ease; }
  .tab-btn:hover{ background:var(--bg-elevated); color:var(--ink); }
  .tab-btn.active{ background:var(--bg-card); border-color:var(--border); border-left-color:var(--malachite); box-shadow:0 1px 2px oklch(0.2 0.01 250 / 0.05); color:var(--ink); }
  .tab-code{ font-family:var(--font-mono); font-size:10.5px; font-weight:600; color:var(--ink-faint); background:var(--bg-elevated); border:1px solid var(--border-soft); border-radius:4px; padding:2px 6px; flex-shrink:0; min-width:30px; text-align:center; }
  .tab-btn.active .tab-code{ color:var(--malachite); border-color:var(--malachite-dim); background:var(--bg-tint-malachite); }
  .tab-label{ font-size:12.5px; font-weight:500; line-height:1.3; }
  .tab-btn.active .tab-label{ color:var(--ink); font-weight:600; }

  main{ flex:1; min-width:0; padding:28px 34px 90px; max-width:1000px; }

  .report-doc{ background:var(--bg-card); border:1px solid var(--border-soft); border-top:3px solid var(--malachite); border-radius:10px; overflow:hidden; box-shadow:0 1px 3px oklch(0.2 0.01 250 / 0.05), 0 6px 24px oklch(0.2 0.01 250 / 0.04); }
  .report-letterhead{ padding:26px 32px 20px; border-bottom:1px solid var(--border-soft); }
  .lh-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:14px; }
  .lh-idbadges{ display:flex; gap:8px; flex-wrap:wrap; }
  .tag{ font-family:var(--font-mono); font-size:10.5px; padding:2px 8px; border-radius:20px; border:1px solid var(--border); color:var(--ink-dim); white-space:nowrap; }
  .tag.pro{ color:var(--ochre); border-color:var(--ochre-dim); background:var(--bg-tint-ochre); font-weight:600; }
  .tag.tab-name{ color:var(--malachite); border-color:var(--malachite-dim); background:var(--bg-tint-malachite); }
  .tag.sample{ color:var(--copper); border-color:var(--copper-dim); background:var(--bg-tint-copper); font-weight:600; }
  .lh-meta{ font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); text-align:right; }
  h2.report-title{ font-family:var(--font-display); font-weight:600; font-size:25px; margin:0 0 10px; color:var(--ink); letter-spacing:-0.01em; }
  .lh-generated-by{ font-size:13px; color:var(--ink-dim); margin-bottom:12px; }
  .lh-generated-by b{ color:var(--ink); }
  .filter-chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .filter-chip{ font-family:var(--font-mono); font-size:10.5px; color:var(--ink-dim); background:var(--bg-elevated); border:1px solid var(--border-soft); border-radius:5px; padding:3px 8px; }
  .filter-chip .k{ color:var(--ink-faint); margin-right:3px; }

  .contents-nav{ display:flex; gap:7px; flex-wrap:wrap; padding:14px 32px; background:var(--bg-elevated); border-bottom:1px solid var(--border-soft); }
  .contents-nav .cn-label{ font-family:var(--font-mono); font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-faint); margin-right:4px; align-self:center; }
  .contents-nav a{ font-family:var(--font-mono); font-size:10.5px; color:var(--ink-dim); text-decoration:none; background:var(--bg-card); border:1px solid var(--border-soft); border-radius:20px; padding:4px 10px; transition:border-color .15s, color .15s; }
  .contents-nav a:hover{ border-color:var(--malachite-dim); color:var(--malachite); }

  .report-body{ padding:26px 32px 6px; }
  .section{ margin-bottom:30px; scroll-margin-top:90px; }
  .section-label{ font-family:var(--font-mono); font-size:10.5px; letter-spacing:0.09em; text-transform:uppercase; color:var(--copper); margin-bottom:12px; padding-bottom:9px; border-bottom:1px solid var(--border-soft); }
  .narrative-text{ font-family:var(--font-serif); font-size:14.5px; color:var(--ink-dim); margin:0; line-height:1.7; }
  .narrative-text b{ color:var(--ink); font-weight:600; font-family:var(--font-body); }

  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:12px; }
  .stat-tile{ background:var(--bg-elevated); border:1px solid var(--border-soft); border-radius:8px; padding:13px 15px; }
  .stat-tile .v{ font-family:var(--font-display); font-weight:700; font-size:21px; color:var(--malachite); }
  .stat-tile .l{ font-family:var(--font-mono); font-size:10px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.05em; margin-top:3px; }

  table.rtable{ width:100%; border-collapse:collapse; font-size:12.5px; }
  table.rtable th{ font-family:var(--font-mono); font-size:10px; letter-spacing:0.05em; text-transform:uppercase; color:var(--ink-faint); text-align:left; padding:9px 11px; background:var(--bg-elevated); border-bottom:1px solid var(--border-soft); white-space:nowrap; }
  table.rtable td{ padding:9px 11px; color:var(--ink-dim); border-bottom:1px solid var(--border-soft); white-space:nowrap; }
  table.rtable tr:last-child td{ border-bottom:none; }
  table.rtable tr:hover td{ background:var(--bg-elevated); }
  table.rtable td.strong{ color:var(--ink); font-weight:600; }
  .table-wrap{ overflow-x:auto; border:1px solid var(--border-soft); border-radius:8px; }
  .table-note{ font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint); margin-top:7px; }

  ul.rlist{ margin:0; padding-left:19px; }
  ul.rlist li{ font-size:13px; color:var(--ink-dim); margin-bottom:6px; }

  .callout{ padding:13px 15px; border-radius:0 8px 8px 0; margin-top:4px; }
  .callout.warn{ background:var(--bg-tint-red); border-left:3px solid var(--red); }
  .callout.info{ background:var(--bg-tint-malachite); border-left:3px solid var(--malachite); }
  .callout p{ margin:0; font-size:13px; color:var(--ink); }
  .callout .clabel{ font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:0.07em; margin-bottom:5px; font-weight:600; }
  .callout.warn .clabel{ color:var(--red); }
  .callout.info .clabel{ color:var(--malachite); }

  .chart-box{ border:1px solid var(--border-soft); border-radius:8px; padding:16px 14px 6px; background:var(--bg-elevated); }
  .legend-row{ display:flex; gap:16px; justify-content:center; margin-top:8px; flex-wrap:wrap; }
  .legend-item{ display:flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:10.5px; color:var(--ink-dim); }
  .legend-dot{ width:8px; height:8px; border-radius:2px; }

  .gauge-row{ display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .gauge-row:last-child{ margin-bottom:0; }
  .gauge-label{ font-size:12.5px; color:var(--ink-dim); width:220px; flex-shrink:0; }
  .gauge-track{ flex:1; height:8px; background:var(--bg-elevated); border:1px solid var(--border-soft); border-radius:6px; overflow:hidden; }
  .gauge-fill{ height:100%; border-radius:6px; }
  .gauge-value{ font-family:var(--font-mono); font-size:11px; color:var(--ink); width:110px; text-align:right; flex-shrink:0; }

  .timeline{ position:relative; padding-left:2px; }
  .tl-item{ display:flex; gap:14px; position:relative; padding-bottom:20px; }
  .tl-item:last-child{ padding-bottom:0; }
  .tl-item:not(:last-child)::before{ content:''; position:absolute; left:5px; top:15px; bottom:-5px; width:1px; background:var(--border); }
  .tl-dot{ width:11px; height:11px; border-radius:50%; background:var(--malachite); margin-top:3px; flex-shrink:0; box-shadow:0 0 0 3px var(--bg-tint-malachite); }
  .tl-date{ font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint); }
  .tl-label{ font-weight:600; font-size:13px; color:var(--ink); margin:2px 0; }
  .tl-text{ font-size:12.5px; color:var(--ink-dim); }

  .methodology{ margin:6px 32px 0; padding:16px 0 20px; border-top:1px solid var(--border-soft); }
  .methodology .m-label{ font-family:var(--font-mono); font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:6px; }
  .methodology p{ font-family:var(--font-serif); font-style:italic; font-size:12px; color:var(--ink-faint); margin:0; line-height:1.6; }

  .report-footer{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; padding:16px 32px; border-top:1px solid var(--border-soft); background:var(--bg-elevated); }
  .export-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .export-btn{ font-family:var(--font-mono); font-size:11px; color:var(--ink-dim); border:1px solid var(--border); border-radius:6px; padding:6px 12px; background:var(--bg-card); cursor:default; user-select:none; }
  .export-btn.primary{ color:var(--bg-card); background:var(--malachite); border-color:var(--malachite); font-weight:600; }
  .footer-note{ font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint); }

  .persona-context{ margin-bottom:16px; }
  .persona-context .eyebrow{ font-family:var(--font-mono); font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:4px; }

  @media (max-width: 860px){
    .shell{ flex-direction:column; }
    .rail{ width:100%; height:auto; position:sticky; top:0; z-index:15; display:flex; overflow-x:auto; overflow-y:hidden; padding:10px 10px; border-right:none; border-bottom:1px solid var(--border-soft); gap:4px; }
    .rail-label{ display:none; }
    .tab-btn{ width:auto; flex-shrink:0; margin-bottom:0; white-space:nowrap; border-left:none; border-bottom:3px solid transparent; }
    .tab-btn.active{ border-left:none; border-bottom-color:var(--malachite); }
    main{ padding:20px 14px 60px; }
    .lh-meta{ text-align:left; }
    .report-letterhead, .report-body, .report-footer, .contents-nav{ padding-left:16px; padding-right:16px; }
    .methodology{ margin-left:16px; margin-right:16px; }
    .gauge-label{ width:130px; font-size:11.5px; }
  }
  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:6px; }
  ::-webkit-scrollbar-track{ background:transparent; }
</style>
</head>

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }

function statGrid(items){
  return `<div class="stat-grid">${items.map(i => `<div class="stat-tile"><div class="v">${i.v}</div><div class="l">${i.l}</div></div>`).join('')}</div>`;
}
function dataTable(cols, rows, note){
  return `<div class="table-wrap"><table class="rtable"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>
    ${rows.map(r => `<tr>${r.map((cell,i) => `<td class="${i===0?'strong':''}">${cell}</td>`).join('')}</tr>`).join('')}
  </tbody></table></div>${note ? `<div class="table-note">${note}</div>` : ''}`;
}
function gaugeRows(items){
  return items.map(i => `<div class="gauge-row">
    <div class="gauge-label">${i.label}</div>
    <div class="gauge-track"><div class="gauge-fill" style="width:${Math.max(2,Math.min(100,i.pct))}%;background:${i.color||C.malachite}"></div></div>
    <div class="gauge-value">${i.display}</div>
  </div>`).join('');
}
function timelineHtml(events){
  return `<div class="timeline">${events.map(e => `
    <div class="tl-item">
      <div class="tl-dot"></div>
      <div class="tl-content">
        <div class="tl-date">${e.date}</div>
        <div class="tl-label">${e.label}</div>
        <div class="tl-text">${e.text}</div>
      </div>
    </div>`).join('')}</div>`;
}
function barChart(data, opts={}){
  const w=680,h=opts.height||190;
  const pad={t:26,r:14,b:32,l:14};
  const innerW=w-pad.l-pad.r, innerH=h-pad.t-pad.b;
  const vals=data.map(d=>d.value);
  const maxV=Math.max(...vals,0), minV=Math.min(...vals,0);
  const range=(maxV-minV)||1;
  const zeroY=pad.t+innerH*(maxV/range);
  const n=data.length, gap=innerW/n;
  const barW=Math.min(gap*0.55,50);
  let bars='';
  data.forEach((d,i)=>{
    const x=pad.l+gap*i+(gap-barW)/2;
    const barH=Math.abs(d.value)/range*innerH;
    const y=d.value>=0? zeroY-barH : zeroY;
    const color=d.color||opts.color||C.malachite;
    bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(barH,1).toFixed(1)}" rx="3" fill="${color}"/>`;
    const valY = d.value>=0 ? y-7 : y+barH+14;
    bars+=`<text x="${(x+barW/2).toFixed(1)}" y="${valY.toFixed(1)}" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5" fill="${C.inkDim}">${opts.valuePrefix||''}${d.value}${opts.valueSuffix||''}</text>`;
    bars+=`<text x="${(x+barW/2).toFixed(1)}" y="${h-9}" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" fill="${C.inkFaint}">${d.label}</text>`;
  });
  const zeroLine = `<line x1="${pad.l}" y1="${zeroY.toFixed(1)}" x2="${w-pad.r}" y2="${zeroY.toFixed(1)}" stroke="${C.border}" stroke-width="1"/>`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;">${zeroLine}${bars}</svg>`;
}
function groupedBarChart(groups, colors, opts={}){
  const w=680,h=opts.height||220;
  const pad={t:26,r:14,b:42,l:14};
  const innerW=w-pad.l-pad.r, innerH=h-pad.t-pad.b;
  const maxV=100;
  const n=groups.length, s=colors.length;
  const groupGap=innerW/n;
  const barW=Math.min((groupGap*0.7)/s,20);
  const seriesGap=3;
  let bars='';
  groups.forEach((g,gi)=>{
    const setW=barW*s+seriesGap*(s-1);
    const gx=pad.l+groupGap*gi+(groupGap-setW)/2;
    g.values.forEach((v,si)=>{
      const barH=(v/maxV)*innerH;
      const x=gx+si*(barW+seriesGap);
      const y=pad.t+innerH-barH;
      bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" rx="2" fill="${colors[si]}"/>`;
      bars+=`<text x="${(x+barW/2).toFixed(1)}" y="${(y-4).toFixed(1)}" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="${C.inkDim}">${v}</text>`;
    });
    bars+=`<text x="${(gx+setW/2).toFixed(1)}" y="${h-22}" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="${C.inkFaint}">${g.label}</text>`;
  });
  const baseline=`<line x1="${pad.l}" y1="${(pad.t+innerH).toFixed(1)}" x2="${w-pad.r}" y2="${(pad.t+innerH).toFixed(1)}" stroke="${C.border}" stroke-width="1"/>`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;">${baseline}${bars}</svg>`;
}
function lineChart(data, opts={}){
  const w=680,h=opts.height||200;
  const pad={t:26,r:24,b:32,l:24};
  const innerW=w-pad.l-pad.r, innerH=h-pad.t-pad.b;
  const vals=data.map(d=>d.value);
  const maxV=Math.max(...vals), minV=Math.min(...vals);
  const range=(maxV-minV)||1;
  const n=data.length, stepX = n>1 ? innerW/(n-1) : 0;
  const pts=data.map((d,i)=>({ x:pad.l+stepX*i, y:pad.t+innerH-((d.value-minV)/range)*innerH, d }));
  const pathD=pts.map((p,i)=> (i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  const areaD = pathD + ` L${pts[pts.length-1].x.toFixed(1)},${(pad.t+innerH).toFixed(1)} L${pts[0].x.toFixed(1)},${(pad.t+innerH).toFixed(1)} Z`;
  let dots='', labels='';
  pts.forEach(p=>{
    dots+=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" fill="${C.malachite}"/>`;
    dots+=`<text x="${p.x.toFixed(1)}" y="${(p.y-11).toFixed(1)}" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="${C.inkDim}">${p.d.value}</text>`;
    labels+=`<text x="${p.x.toFixed(1)}" y="${h-9}" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" fill="${C.inkFaint}">${p.d.label}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;">
    <path d="${areaD}" fill="${C.malachite}" opacity="0.08"/>
    <path d="${pathD}" fill="none" stroke="${C.malachite}" stroke-width="2"/>
    ${dots}${labels}
  </svg>`;
}

function renderSection(s, reportId){
  const heading = s.title;
  const id = `${reportId}-${slug(heading||'section')}`;
  let inner = '';
  if (s.type === 'narrative') inner = `<p class="narrative-text">${s.text}</p>`;
  else if (s.type === 'stats') inner = statGrid(s.items);
  else if (s.type === 'table') inner = dataTable(s.columns, s.rows, s.note);
  else if (s.type === 'list') inner = `<ul class="rlist">${s.items.map(i=>`<li>${i}</li>`).join('')}</ul>`;
  else if (s.type === 'callout') inner = `<div class="callout ${s.tone}"><div class="clabel">${s.label}</div><p>${s.text}</p></div>`;
  else if (s.type === 'chart-bar') inner = `<div class="chart-box">${barChart(s.data, s)}</div>`;
  else if (s.type === 'chart-line') inner = `<div class="chart-box">${lineChart(s.data, s)}</div>`;
  else if (s.type === 'chart-grouped') inner = `<div class="chart-box">${groupedBarChart(s.groups, s.colors, s)}<div class="legend-row">${s.series.map((name,i)=>`<span class="legend-item"><span class="legend-dot" style="background:${s.colors[i]}"></span>${name}</span>`).join('')}</div></div>`;
  else if (s.type === 'gauges') inner = gaugeRows(s.items);
  else if (s.type === 'timeline') inner = timelineHtml(s.events);
  const showLabel = s.type !== 'callout';
  return { html:`<div class="section" id="${id}">${showLabel && heading ? `<div class="section-label">${heading}</div>` : ''}${inner}</div>`, id, heading:heading||s.label };
}

function tagsFor(r){
  let out = `<span class="tag tab-name">${r.tab}</span>`;
  if (r.tier === 'pro') out += `<span class="tag pro">PRO</span>`;
  out += `<span class="tag sample">SAMPLE</span>`;
  return out;
}

function renderReport(r){
  const rendered = r.sections.map(s => renderSection(s, r.code));
  const nav = rendered.filter(x => x.heading).map(x => `<a href="#${x.id}">${x.heading}</a>`).join('');
  return `
    <div class="persona-context">
      <div class="eyebrow">Persona ${r.code} — ${r.persona}</div>
    </div>
    <div class="report-doc">
      <div class="report-letterhead">
        <div class="lh-top">
          <div class="lh-idbadges">${tagsFor(r)}</div>
          <div class="lh-meta">Report ${r.id} · Generated 11 Aug 2026, 09:14 GMT</div>
        </div>
        <h2 class="report-title">${r.title}</h2>
        <div class="lh-generated-by">Generated for <b>${r.user.name}</b> · ${r.user.role}</div>
        <div class="filter-chips">${r.filters.map(f => `<span class="filter-chip"><span class="k">${f.k}:</span>${f.v}</span>`).join('')}</div>
      </div>
      <div class="contents-nav"><span class="cn-label">On this report</span>${nav}</div>
      <div class="report-body">
        ${rendered.map(x => x.html).join('')}
      </div>
      ${r.methodology ? `<div class="methodology"><div class="m-label">Methodology &amp; Sources</div><p>${r.methodology}</p></div>` : ''}
      <div class="report-footer">
        <div class="export-row">
          <span class="export-btn primary">Export PDF</span>
          <span class="export-btn">Export Markdown</span>
          <span class="export-btn">Open in AI Copilot</span>
        </div>
        <div class="footer-note">MineSentinel Intelligence Hub · Sample output</div>
      </div>
    </div>
  `;
}

let activeCode = REPORTS[0].code;

function render(){
  const rail = document.getElementById('rail');
  const main = document.getElementById('main');

  rail.innerHTML = `<div class="rail-label">Switch persona</div>` + REPORTS.map(r => `
    <button class="tab-btn ${r.code === activeCode ? 'active' : ''}" data-code="${r.code}">
      <span class="tab-code">${r.code}</span>
      <span class="tab-label">${r.label}</span>
    </button>
  `).join('');

  rail.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeCode = btn.getAttribute('data-code');
      render();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });

  const report = REPORTS.find(r => r.code === activeCode);
  main.innerHTML = renderReport(report);
}

render();
</script>

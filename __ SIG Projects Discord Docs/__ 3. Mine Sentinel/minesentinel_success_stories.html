<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MineSentinel — Customer Success Stories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0d1512;
    --surface:#121b17;
    --surface-2:#182420;
    --line: rgba(233,237,229,0.09);
    --line-strong: rgba(233,237,229,0.16);
    --paper:#e9ede5;
    --paper-dim:#a6b3aa;
    --paper-dimmer:#6f7d74;
    --malachite:#37b07c;
    --malachite-dim:rgba(55,176,124,0.14);
    --ochre:#d99a3c;
    --ochre-dim:rgba(217,154,60,0.14);
    --copper:#c06b42;
    --copper-dim:rgba(192,107,66,0.14);
    --radius:10px;
    --disp: 'Space Grotesk', sans-serif;
    --body: 'Inter', sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 85% -10%, rgba(55,176,124,0.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at -5% 110%, rgba(217,154,60,0.08), transparent 60%),
      var(--ink);
    color:var(--paper);
    font-family:var(--body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{ background:var(--malachite); color:#06110c; }

  .shell{ display:flex; min-height:100vh; }

  /* ---------- Sidebar ---------- */
  .rail{
    width:288px; flex:none;
    border-right:1px solid var(--line);
    padding:28px 16px 28px 24px;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{ margin-bottom:24px; }
  .brand .mark{
    display:inline-flex; align-items:center; gap:8px;
    font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--malachite);
  }
  .brand .mark::before{
    content:""; width:7px; height:7px; border-radius:50%;
    background:var(--malachite); box-shadow:0 0 0 3px var(--malachite-dim);
  }
  .brand h1{
    font-family:var(--disp); font-weight:600; font-size:19px; margin:10px 0 4px;
    letter-spacing:-.01em;
  }
  .brand p{ margin:0; font-size:12.5px; color:var(--paper-dimmer); line-height:1.5; }

  .railnav{ display:flex; flex-direction:column; gap:3px; margin-top:20px; }
  .railnav-label{
    font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--paper-dimmer); padding:0 10px 8px;
  }
  .tab-btn{
    display:flex; align-items:center; gap:11px;
    background:none; border:none; cursor:pointer;
    text-align:left; color:var(--paper-dim);
    padding:9px 10px; border-radius:8px;
    border-left:2px solid transparent;
    font-family:var(--body);
    transition:background .15s ease, color .15s ease;
    width:100%;
  }
  .tab-btn:hover{ background:var(--surface); color:var(--paper); }
  .tab-btn.active{
    background:var(--surface-2); color:var(--paper);
    border-left:2px solid var(--malachite);
  }
  .tab-btn .avatar{
    flex:none; width:30px; height:30px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--disp); font-weight:600; font-size:11.5px;
    background:var(--surface); border:1px solid var(--line-strong); color:var(--malachite);
  }
  .tab-btn.active .avatar{ background:var(--malachite-dim); border-color:var(--malachite); }
  .tab-btn .avatar svg{ width:15px; height:15px; }
  .tab-btn .tmeta{ min-width:0; }
  .tab-btn .tname{ font-size:12.5px; line-height:1.35; color:var(--paper); }
  .tab-btn .trole{ font-size:10.5px; line-height:1.3; color:var(--paper-dimmer); margin-top:2px; }

  .mobile-strip{ display:none; }

  /* ---------- Main ---------- */
  main{ flex:1; min-width:0; padding:44px 52px 96px; max-width:980px; }
  .story{ display:none; animation:fade .35s ease; }
  .story.active{ display:block; }
  @keyframes fade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

  /* ---- hero ---- */
  .s-hero{ display:flex; gap:18px; align-items:center; margin-bottom:8px; }
  .s-avatar{
    flex:none; width:64px; height:64px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--disp); font-weight:700; font-size:22px;
    background:var(--malachite-dim); border:1px solid var(--malachite); color:var(--malachite);
  }
  .s-eyebrow{
    font-family:var(--mono); font-size:11px; letter-spacing:.1em; color:var(--paper-dimmer);
    text-transform:uppercase; margin-bottom:4px;
  }
  .s-eyebrow .code-big{ color:var(--malachite); font-weight:600; }
  .s-name{ font-family:var(--disp); font-weight:600; font-size:26px; letter-spacing:-.01em; margin:0; line-height:1.15; }
  .s-role{ font-size:13.5px; color:var(--paper-dim); margin:3px 0 0; }
  .s-role b{ color:var(--paper); font-weight:600; }

  .s-loc{
    font-family:var(--mono); font-size:11px; color:var(--paper-dimmer);
    margin:22px 0 30px; display:flex; align-items:center; gap:8px;
  }
  .s-loc::before{ content:"◎"; color:var(--ochre); }

  /* ---- stat band (signature element) ---- */
  .stat-band{
    display:grid; grid-template-columns:repeat(4,1fr); gap:1px;
    background:var(--line); border:1px solid var(--line); border-radius:14px;
    overflow:hidden; margin-bottom:40px;
  }
  .stat-card{ background:var(--surface); padding:18px 16px 16px; }
  .stat-card .sval{ font-family:var(--disp); font-weight:700; font-size:22px; color:var(--malachite); line-height:1.1; }
  .stat-card .slabel{
    font-family:var(--mono); font-size:9.5px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--paper-dimmer); margin-top:7px;
  }
  .stat-card .sbar{
    margin-top:12px; height:5px; border-radius:4px; background:var(--surface-2);
    position:relative; overflow:hidden;
  }
  .stat-card .sbar i{
    position:absolute; left:0; top:0; bottom:0; border-radius:4px;
    background:linear-gradient(90deg, var(--ochre), var(--malachite));
  }
  .stat-card .sfrom{ font-size:10.5px; color:var(--paper-dimmer); margin-top:6px; }
  .stat-card .sfrom s{ color:#e0a888; text-decoration:line-through; opacity:.75; }
  .stat-card .sfrom em{ color:var(--malachite); font-style:normal; font-weight:600; }

  @media (max-width:760px){ .stat-band{ grid-template-columns:repeat(2,1fr); } }

  /* ---- section heads ---- */
  .section-head{ display:flex; align-items:baseline; gap:10px; margin:0 0 12px; }
  .section-head h3{
    font-family:var(--disp); font-weight:600; font-size:14px; margin:0;
    text-transform:uppercase; letter-spacing:.07em; color:var(--paper);
  }
  .section-head .tag{
    font-family:var(--mono); font-size:10px; color:var(--paper-dimmer);
  }

  /* ---- narrative cards ---- */
  .narrative{
    display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:34px;
  }
  @media (max-width:700px){ .narrative{ grid-template-columns:1fr; } }
  .n-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 18px;
  }
  .n-card.challenge{ border-left:2px solid rgba(224,168,136,0.5); }
  .n-card.scenario{ border-left:2px solid var(--ochre); }
  .n-card h4{
    font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase;
    margin:0 0 8px; color:var(--paper-dimmer);
  }
  .n-card p{ font-size:13.5px; color:var(--paper-dim); line-height:1.65; margin:0; }

  /* ---- journey stepper reused for "how" ---- */
  .journey{ position:relative; margin-bottom:36px; }
  .journey-track{ position:relative; padding-left:26px; border-left:2px dashed var(--line-strong); }
  .step{ position:relative; padding-bottom:22px; }
  .step:last-child{ padding-bottom:0; }
  .step::before{
    content:""; position:absolute; left:-31px; top:2px;
    width:10px; height:10px; border-radius:50%;
    background:var(--ink); border:2px solid var(--malachite);
  }
  .step-head{ display:flex; align-items:baseline; gap:9px; margin-bottom:5px; flex-wrap:wrap; }
  .step-num{ font-family:var(--mono); font-size:11px; color:var(--malachite); }
  .step-title{ font-family:var(--disp); font-weight:600; font-size:15px; }
  .step-desc{ font-size:13px; color:var(--paper-dim); line-height:1.6; max-width:70ch; margin:0; }

  /* ---- outcome ---- */
  .outcome{
    background:linear-gradient(180deg, rgba(55,176,124,0.08), transparent);
    border:1px solid var(--line); border-left:2px solid var(--malachite); border-radius:var(--radius);
    padding:18px 20px; margin-bottom:34px;
  }
  .outcome p{ font-size:13.5px; color:var(--paper); line-height:1.7; margin:0; }

  /* ---- chips ---- */
  .chipwrap{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:38px; }
  .chip{
    font-family:var(--mono); font-size:11.5px; color:var(--paper-dim);
    background:var(--surface); border:1px solid var(--line);
    padding:6px 11px; border-radius:100px;
  }

  /* ---- pull quote ---- */
  .quote-block{
    background:var(--surface-2); border:1px solid var(--line); border-radius:14px;
    padding:26px 26px 22px; margin-bottom:8px; position:relative;
  }
  .quote-mark{
    font-family:var(--disp); font-size:46px; color:var(--malachite);
    line-height:1; margin-bottom:2px; opacity:.85;
  }
  .quote-block p{
    font-family:var(--disp); font-weight:500; font-size:19px; line-height:1.5;
    color:var(--paper); margin:0 0 18px; letter-spacing:-.005em;
  }
  .quote-foot{ display:flex; align-items:center; gap:10px; }
  .quote-foot .qav{
    width:32px; height:32px; border-radius:50%; flex:none;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--disp); font-weight:600; font-size:11.5px;
    background:var(--malachite-dim); border:1px solid var(--malachite); color:var(--malachite);
  }
  .quote-foot .qname{ font-size:12.5px; color:var(--paper); font-weight:600; }
  .quote-foot .qrole{ font-size:11.5px; color:var(--paper-dimmer); }

  footer.credit{
    margin-top:52px; padding-top:20px; border-top:1px solid var(--line);
    font-family:var(--mono); font-size:11px; color:var(--paper-dimmer);
  }

  @media (max-width: 880px){
    .shell{ flex-direction:column; }
    .rail{ display:none; }
    .mobile-strip{
      display:flex; gap:6px; overflow-x:auto; padding:16px 16px 12px;
      position:sticky; top:0; background:var(--ink); z-index:10;
      border-bottom:1px solid var(--line);
    }
    .mobile-strip button{
      flex:none; font-family:var(--mono); font-size:11px; padding:7px 12px;
      border-radius:100px; border:1px solid var(--line); background:var(--surface);
      color:var(--paper-dim); white-space:nowrap;
    }
    .mobile-strip button.active{ border-color:var(--malachite); color:var(--malachite); }
    main{ padding:24px 18px 70px; }
    .s-name{ font-size:21px; }
    .s-hero{ gap:12px; }
    .s-avatar{ width:52px; height:52px; font-size:18px; }
    .stat-band{ grid-template-columns:1fr 1fr; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="rail" id="rail">
    <div class="brand">
      <span class="mark">MineSentinel</span>
      <h1>Customer Success Stories</h1>
      <p>Ten professionals, ten workflows — how each one turned research time into decisions.</p>
    </div>
    <div class="railnav-label">Stories</div>
    <nav class="railnav" id="railnav"></nav>
  </aside>

  <div class="mobile-strip" id="mobileStrip"></div>

  <main id="main"></main>
</div>

const railnav = document.getElementById('railnav');
const mobileStrip = document.getElementById('mobileStrip');
const main = document.getElementById('main');

function renderStory(s, idx){
  const stats = s.stats.map(st => `
    <div class="stat-card">
      <div class="sval">${st.v}</div>
      <div class="slabel">${st.l}</div>
      <div class="sbar"><i style="width:${st.pct}%"></i></div>
      <div class="sfrom"><s>${st.from}</s> → <em>${st.to}</em></div>
    </div>`).join('');

  const steps = s.how.map((st,i) => `
    <div class="step">
      <div class="step-head">
        <span class="step-num">${String(i+1).padStart(2,'0')}</span>
        <span class="step-title">${st.t}</span>
      </div>
      <p class="step-desc">${st.d}</p>
    </div>`).join('');

  const chips = s.features.map(f => `<span class="chip">${f}</span>`).join('');

  return `
  <section class="story" id="story-${idx}">
    <div class="s-hero">
      <div class="s-avatar">${initials(s.name)}</div>
      <div>
        <div class="s-eyebrow"><span class="code-big">${s.code}</span> · Success Story</div>
        <h2 class="s-name">${s.name}</h2>
        <p class="s-role"><b>${s.title}</b> · ${s.company}</p>
      </div>
    </div>
    <div class="s-loc">${s.location}</div>

    <div class="stat-band">${stats}</div>

    <div class="narrative">
      <div class="n-card scenario">
        <h4>The Scenario</h4>
        <p>${s.scenario}</p>
      </div>
      <div class="n-card challenge">
        <h4>The Challenge</h4>
        <p>${s.challenge}</p>
      </div>
    </div>

    <div class="section-head"><h3>How ${s.name.split(' ')[0]} used MineSentinel</h3><span class="tag">${s.how.length} steps</span></div>
    <div class="journey"><div class="journey-track">${steps}</div></div>

    <div class="section-head"><h3>The Outcome</h3></div>
    <div class="outcome"><p>${s.outcome}</p></div>

    <div class="section-head"><h3>Key features used</h3><span class="tag">${s.features.length}</span></div>
    <div class="chipwrap">${chips}</div>

    <div class="quote-block">
      <div class="quote-mark">&ldquo;</div>
      <p>${s.quote}</p>
      <div class="quote-foot">
        <div class="qav">${initials(s.name)}</div>
        <div>
          <div class="qname">${s.name}</div>
          <div class="qrole">${s.title}, ${s.company}</div>
        </div>
      </div>
    </div>

    <footer class="credit">MineSentinel Customer Success · Internal · August 2026</footer>
  </section>`;
}

main.innerHTML = STORIES.map(renderStory).join('');

function shortMobileLabel(s){ return s.userType.split('&')[0].split(',')[0].trim(); }

STORIES.forEach((s, idx) => {
  const btn = document.createElement('button');
  btn.className = 'tab-btn' + (idx===0 ? ' active' : '');
  btn.innerHTML = `<span class="avatar">${ICONS[s.icon]}</span><span class="tmeta"><div class="tname">${s.userType}</div><div class="trole">${s.name} · ${s.company}</div></span>`;
  btn.addEventListener('click', () => activate(idx));
  railnav.appendChild(btn);

  const mbtn = document.createElement('button');
  mbtn.textContent = `${s.code} · ${shortMobileLabel(s)}`;
  mbtn.className = idx===0 ? 'active' : '';
  mbtn.addEventListener('click', () => activate(idx));
  mobileStrip.appendChild(mbtn);
});

function activate(idx){
  document.querySelectorAll('.story').forEach((el,i) => el.classList.toggle('active', i===idx));
  document.querySelectorAll('.tab-btn').forEach((el,i) => el.classList.toggle('active', i===idx));
  document.querySelectorAll('.mobile-strip button').forEach((el,i) => el.classList.toggle('active', i===idx));
  window.scrollTo({top:0, behavior:'instant'});
}

activate(0);
</script>

</html>

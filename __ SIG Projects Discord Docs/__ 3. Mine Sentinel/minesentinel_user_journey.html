<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MineSentinel — User Journey Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0d1512;
    --surface:#121b17;
    --surface-2:#182420;
    --line: rgba(233,237,229,0.09);
    --line-strong: rgba(233,237,229,0.16);
    --paper:#e9ede5;
    --paper-dim:#a6b3aa;
    --paper-dimmer:#6f7d74;
    --malachite:#37b07c;
    --malachite-dim:rgba(55,176,124,0.14);
    --ochre:#d99a3c;
    --ochre-dim:rgba(217,154,60,0.14);
    --copper:#c06b42;
    --copper-dim:rgba(192,107,66,0.14);
    --radius:10px;
    --disp: 'Space Grotesk', sans-serif;
    --body: 'Inter', sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 85% -10%, rgba(55,176,124,0.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at -5% 110%, rgba(217,154,60,0.08), transparent 60%),
      var(--ink);
    color:var(--paper);
    font-family:var(--body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{ background:var(--malachite); color:#06110c; }

  .shell{ display:flex; min-height:100vh; }

  /* ---------- Sidebar ---------- */
  .rail{
    width:272px; flex:none;
    border-right:1px solid var(--line);
    padding:28px 18px 28px 24px;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{ margin-bottom:26px; }
  .brand .mark{
    display:inline-flex; align-items:center; gap:8px;
    font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--malachite);
  }
  .brand .mark::before{
    content:""; width:7px; height:7px; border-radius:50%;
    background:var(--malachite); box-shadow:0 0 0 3px var(--malachite-dim);
  }
  .brand h1{
    font-family:var(--disp); font-weight:600; font-size:20px; margin:10px 0 4px;
    letter-spacing:-.01em;
  }
  .brand p{ margin:0; font-size:12.5px; color:var(--paper-dimmer); line-height:1.5; }

  .railnav{ display:flex; flex-direction:column; gap:2px; margin-top:22px; }
  .railnav-label{
    font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--paper-dimmer); padding:0 10px 8px;
  }
  .tab-btn{
    display:flex; align-items:center; gap:11px;
    background:none; border:none; cursor:pointer;
    text-align:left; color:var(--paper-dim);
    padding:9px 10px; border-radius:8px;
    border-left:2px solid transparent;
    font-family:var(--body);
    transition:background .15s ease, color .15s ease;
  }
  .tab-btn:hover{ background:var(--surface); color:var(--paper); }
  .tab-btn.active{
    background:var(--surface-2); color:var(--paper);
    border-left:2px solid var(--malachite);
  }
  .tab-btn .code{
    font-family:var(--mono); font-size:10.5px; color:var(--malachite);
    min-width:28px; flex:none;
  }
  .tab-btn.active .code{ color:var(--malachite); }
  .tab-btn .icon{ flex:none; width:16px; height:16px; opacity:.85; }
  .tab-btn .label{ font-size:13px; line-height:1.3; }

  /* mobile tab strip */
  .mobile-strip{ display:none; }

  /* ---------- Main ---------- */
  main{ flex:1; min-width:0; padding:40px 48px 90px; max-width:1000px; }
  .persona{ display:none; animation:fade .35s ease; }
  .persona.active{ display:block; }
  @keyframes fade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

  .p-eyebrow{
    font-family:var(--mono); font-size:11.5px; letter-spacing:.1em; color:var(--paper-dimmer);
    display:flex; align-items:center; gap:10px; margin-bottom:10px;
  }
  .p-eyebrow .code-big{ color:var(--malachite); font-weight:600; }
  .p-title{
    font-family:var(--disp); font-weight:600; font-size:34px; letter-spacing:-.015em;
    margin:0 0 8px; line-height:1.1;
  }
  .p-roles{ color:var(--paper-dimmer); font-size:14px; line-height:1.6; max-width:70ch; margin:0 0 34px; }

  .section-head{
    display:flex; align-items:baseline; gap:10px; margin:0 0 16px;
  }
  .section-head h3{
    font-family:var(--disp); font-weight:600; font-size:15px; margin:0;
    text-transform:uppercase; letter-spacing:.06em;
  }
  .section-head .n{ font-family:var(--mono); font-size:11px; color:var(--paper-dimmer); }

  /* ---- pain transform cards ---- */
  .pains{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(240px,1fr));
    gap:10px; margin-bottom:44px;
  }
  .pain-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 15px;
  }
  .pain-before{
    font-size:12.5px; color:#e0a888; line-height:1.5; margin-bottom:8px;
    padding-left:14px; border-left:2px solid rgba(224,168,136,0.4);
  }
  .pain-arrow{ color:var(--malachite); font-family:var(--mono); font-size:11px; margin:0 0 8px 14px; }
  .pain-after{
    font-size:13px; color:var(--paper); line-height:1.5; font-weight:500;
    padding-left:14px; border-left:2px solid var(--malachite);
  }

  /* ---- journey stepper (core-sample style) ---- */
  .journey{ position:relative; margin-bottom:48px; }
  .journey-track{
    position:relative; padding-left:26px;
    border-left:2px dashed var(--line-strong);
  }
  .step{
    position:relative; padding-bottom:26px;
  }
  .step:last-child{ padding-bottom:0; }
  .step::before{
    content:""; position:absolute; left:-31px; top:2px;
    width:10px; height:10px; border-radius:50%;
    background:var(--ink); border:2px solid var(--malachite);
  }
  .step-head{ display:flex; align-items:baseline; gap:9px; margin-bottom:6px; flex-wrap:wrap; }
  .step-num{ font-family:var(--mono); font-size:11px; color:var(--malachite); }
  .step-title{ font-family:var(--disp); font-weight:600; font-size:16px; }
  .step-tag{
    font-family:var(--mono); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--paper-dimmer); background:var(--surface); border:1px solid var(--line);
    padding:2px 8px; border-radius:100px;
  }
  .step-desc{ font-size:13.5px; color:var(--paper-dim); line-height:1.65; max-width:70ch; margin:0; }
  .step-desc b{ color:var(--paper); font-weight:600; }
  .step-desc em{ color:var(--ochre); font-style:normal; }

  /* ---- data chips ---- */
  .chipwrap{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:44px; }
  .chip{
    font-family:var(--mono); font-size:11.5px; color:var(--paper-dim);
    background:var(--surface); border:1px solid var(--line);
    padding:6px 11px; border-radius:100px;
  }

  /* ---- reports ---- */
  .reports{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(260px,1fr));
    gap:10px; margin-bottom:30px;
  }
  .report-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 15px;
  }
  .report-card .rname{
    font-family:var(--disp); font-weight:600; font-size:13.5px; color:var(--ochre);
    margin-bottom:5px;
  }
  .report-card .rdesc{ font-size:12.5px; color:var(--paper-dim); line-height:1.55; }

  /* ---- sample report preview (document mock) ---- */
  .doc-preview{
    background:var(--surface-2); border:1px solid var(--line); border-radius:14px;
    padding:0; margin-bottom:44px; overflow:hidden;
  }
  .doc-head{
    padding:16px 20px; border-bottom:1px solid var(--line);
    display:flex; align-items:flex-start; justify-content:space-between; gap:14px; flex-wrap:wrap;
    background:linear-gradient(180deg, rgba(55,176,124,0.06), transparent);
  }
  .doc-head-left .doc-kicker{
    font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--malachite); margin-bottom:5px;
  }
  .doc-head-left .doc-title{ font-family:var(--disp); font-weight:600; font-size:17px; }
  .doc-head-right{
    font-family:var(--mono); font-size:10.5px; color:var(--paper-dimmer); text-align:right; line-height:1.6;
  }
  .doc-body{ padding:18px 20px 20px; }
  .doc-fields{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr));
    gap:12px 20px; margin-bottom:18px;
  }
  .doc-field .k{
    font-family:var(--mono); font-size:10px; letter-spacing:.05em; text-transform:uppercase;
    color:var(--paper-dimmer); margin-bottom:3px;
  }
  .doc-field .v{ font-size:13px; color:var(--paper); line-height:1.4; }
  .doc-excerpt{
    border-top:1px dashed var(--line-strong); padding-top:14px; margin-top:4px;
  }
  .doc-excerpt .ex-label{
    font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--paper-dimmer); margin-bottom:8px;
  }
  .doc-excerpt p{
    font-size:13px; color:var(--paper-dim); line-height:1.65; margin:0;
    border-left:2px solid var(--ochre); padding-left:13px;
  }

  /* ---- copilot mock ---- */
  .copilot-box{
    background:var(--surface-2); border:1px solid var(--line); border-radius:14px;
    padding:16px 18px 18px;
  }
  .copilot-head{
    display:flex; align-items:center; gap:8px; margin-bottom:14px;
    font-family:var(--mono); font-size:11px; color:var(--paper-dimmer); letter-spacing:.06em;
  }
  .copilot-head .dot{ width:6px; height:6px; border-radius:50%; background:var(--malachite); }
  .qbubble{
    font-size:13px; color:var(--paper); line-height:1.5;
    background:var(--surface); border:1px solid var(--line);
    border-radius:10px 10px 10px 3px;
    padding:10px 13px; margin-bottom:8px; max-width:80ch;
  }
  .qbubble:last-child{ margin-bottom:0; }
  .qbubble::before{ content:"“"; color:var(--malachite); font-family:var(--disp); margin-right:2px; }
  .qbubble::after{ content:"”"; color:var(--malachite); font-family:var(--disp); margin-left:1px; }

  footer.credit{
    margin-top:60px; padding-top:20px; border-top:1px solid var(--line);
    font-family:var(--mono); font-size:11px; color:var(--paper-dimmer);
  }

  @media (max-width: 880px){
    .shell{ flex-direction:column; }
    .rail{ display:none; }
    .mobile-strip{
      display:flex; gap:6px; overflow-x:auto; padding:16px 16px 12px;
      position:sticky; top:0; background:var(--ink); z-index:10;
      border-bottom:1px solid var(--line);
    }
    .mobile-strip button{
      flex:none; font-family:var(--mono); font-size:11px; padding:7px 12px;
      border-radius:100px; border:1px solid var(--line); background:var(--surface);
      color:var(--paper-dim); white-space:nowrap;
    }
    .mobile-strip button.active{ border-color:var(--malachite); color:var(--malachite); }
    main{ padding:24px 18px 70px; }
    .p-title{ font-size:26px; }
    .doc-head-right{ text-align:left; }
  }
</style>
</head>

</div>

    {n:"Incident Timeline Report", d:"A chronological list of every recorded incident and violation at a mine, for tracing a pattern over time rather than a single event."},
    {n:"Ownership Investigation Report", d:"The corporate chain traced from the licence holder to the ultimate beneficial owner, for stories that hinge on who's really behind an asset."},
    {n:"Regulatory History Report", d:"Every government regulatory action against a mine or company, compiled as a single documented record."},
    {n:"Geographic Context Report", d:"A map showing the mine's location relative to communities, water bodies and protected areas, for stories where proximity is the story."},
    {n:"Production Significance Report", d:"A mine's share of national and global production, used to establish why a given mine or event actually matters."},
  ],
  sample:{
    kicker:"Sample output · Mine Factsheet",
    title:"Kaseri Gold Mine — Ghana",
    meta:["Generated 11 Aug 2026","Scope: Single asset, shareable","Format: PDF"],
    fields:[
      {k:"Owner (ultimate)", v:"Meridian Resources Group"},
      {k:"Ownership last changed", v:"2019 — acquired from Torvane Minerals"},
      {k:"Licence status", v:"Valid, expires Mar 2031"},
      {k:"Share of national gold output", v:"~5.2%"},
      {k:"ESG incidents (5 yr)", v:"1 — water discharge notice, 2023, resolved"},
      {k:"Nearest community", v:"Kaseri village, 2.1 km"},
    ],
    excerptLabel:"Excerpt — Factsheet Summary",
    excerpt:"Kaseri Gold Mine has been owned by Meridian Resources Group since a 2019 acquisition from Torvane Minerals and holds a valid mining licence through 2031. The mine represents approximately 5.2% of Ghana's national gold output. One ESG incident is on record in the past five years — a 2023 water discharge notice, resolved within the regulator's compliance window with no repeat findings. The nearest community, Kaseri village, sits 2.1 km from the pit boundary."
  },
  copilot:[
    "Who ultimately owns Mine X, and when did ownership change?",
    "What environmental incidents have been recorded at Mine X in the past 5 years?",
    "Compare what Company said in its sustainability report against its ESG incident record.",
  ]
},
];

const railnav = document.getElementById('railnav');
const mobileStrip = document.getElementById('mobileStrip');
const main = document.getElementById('main');

function renderPersona(p, idx){
  const pains = p.pains.map(pc => `
    <div class="pain-card">
      <div class="pain-before">${pc.before}</div>
      <div class="pain-arrow">↓ solved by</div>
      <div class="pain-after">${pc.after}</div>
    </div>`).join('');

  const steps = p.steps.map((s,i) => `
    <div class="step">
      <div class="step-head">
        <span class="step-num">${String(i+1).padStart(2,'0')}</span>
        <span class="step-title">${s.t}</span>
      </div>
      <p class="step-desc">${s.d}</p>
    </div>`).join('');

  const chips = p.data.map(d => `<span class="chip">${d}</span>`).join('');

  const reports = p.reports.map(r => `
    <div class="report-card">
      <div class="rname">${r.n}</div>
      <div class="rdesc">${r.d}</div>
    </div>`).join('');

  const sampleMeta = p.sample.meta.map(m => `<div>${m}</div>`).join('');
  const sampleFields = p.sample.fields.map(f => `
    <div class="doc-field">
      <div class="k">${f.k}</div>
      <div class="v">${f.v}</div>
    </div>`).join('');

  const copilot = p.copilot.map(q => `<div class="qbubble">${q}</div>`).join('');

  return `
  <section class="persona" id="persona-${idx}">
    <div class="p-eyebrow"><span class="code-big">${p.code}</span> · User Journey</div>
    <h2 class="p-title">${p.title}</h2>
    <p class="p-roles">${p.roles}</p>

    <div class="section-head"><h3>Pain points solved</h3><span class="n">${p.pains.length}</span></div>
    <div class="pains">${pains}</div>

    <div class="section-head"><h3>Platform journey</h3><span class="n">${p.steps.length} steps</span></div>
    <div class="journey"><div class="journey-track">${steps}</div></div>

    <div class="section-head"><h3>Data they can access</h3><span class="n">${p.data.length}</span></div>
    <div class="chipwrap">${chips}</div>

    <div class="section-head"><h3>Copilot in action</h3></div>
    <div class="copilot-box">
      <div class="copilot-head"><span class="dot"></span> COPILOT · EXAMPLE QUERIES</div>
      ${copilot}
    </div>

    <div class="section-head" style="margin-top:44px;"><h3>Reports they can generate</h3><span class="n">${p.reports.length}</span></div>
    <div class="reports">${reports}</div>

    <div class="doc-preview">
      <div class="doc-head">
        <div class="doc-head-left">
          <div class="doc-kicker">${p.sample.kicker}</div>
          <div class="doc-title">${p.sample.title}</div>
        </div>
        <div class="doc-head-right">${sampleMeta}</div>
      </div>
      <div class="doc-body">
        <div class="doc-fields">${sampleFields}</div>
        <div class="doc-excerpt">
          <div class="ex-label">${p.sample.excerptLabel}</div>
          <p>${p.sample.excerpt}</p>
        </div>
      </div>
    </div>

    <footer class="credit">MineSentinel User Guide · Internal · August 2026</footer>
  </section>`;
}

main.innerHTML = PERSONAS.map(renderPersona).join('');

function shortLabel(p){
  return p.title.split('&')[0].split(',')[0].trim();
}

PERSONAS.forEach((p, idx) => {
  const btn = document.createElement('button');
  btn.className = 'tab-btn' + (idx===0 ? ' active' : '');
  btn.innerHTML = `<span class="icon">${ICONS[p.icon]}</span><span class="code">${p.code}</span><span class="label">${shortLabel(p)}</span>`;
  btn.addEventListener('click', () => activate(idx));
  railnav.appendChild(btn);

  const mbtn = document.createElement('button');
  mbtn.textContent = `${p.code} · ${shortLabel(p)}`;
  mbtn.className = idx===0 ? 'active' : '';
  mbtn.addEventListener('click', () => activate(idx));
  mobileStrip.appendChild(mbtn);
});

function activate(idx){
  document.querySelectorAll('.persona').forEach((el,i) => el.classList.toggle('active', i===idx));
  document.querySelectorAll('.tab-btn').forEach((el,i) => el.classList.toggle('active', i===idx));
  document.querySelectorAll('.mobile-strip button').forEach((el,i) => el.classList.toggle('active', i===idx));
  window.scrollTo({top:0, behavior:'instant'});
}

activate(0);
</script>
</body>
</html>
